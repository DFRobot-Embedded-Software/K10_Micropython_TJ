name: ESP32-S3 Build

on:
  push:
    branches: [ main, esp32s3-* ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/*.yml'
      - 'tools/**'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'examples/**'
      - 'mpy-cross/**'
      - 'ports/esp32/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Setup ESP-IDF
      uses: espressif/setup-esp-idf@v1
      with:
        esp-idf-version: 'v5.1.2'
        target: esp32s3
    
    - name: Build ESP32-S3
      run: |
        cd ports/esp32
        make BOARD=ESP32_GENERIC_S3
        make BOARD=ESP32_GENERIC_S3 submodules
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware
        path: ports/esp32/build-ESP32_GENERIC_S3/firmware.bin
